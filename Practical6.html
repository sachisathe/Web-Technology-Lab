<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>CD Catalog</title>
  <link rel="stylesheet" href="Practical5.style.css">
</head>

<body>
  <h2 style="text-align:center;">CD Catalog</h2>
  <button onclick="loadXMLDoc()">Get CD Catalog</button>
  <div id="cdTable"></div>

  <script>
    function loadXMLDoc() {
      const xhttp = new XMLHttpRequest();
      xhttp.onreadystatechange = function () {
        if (this.readyState == 4 && this.status == 200) {
          cdDetails(this);
        }
      };
      // Make sure cd_catalog.xml is in the same folder as this HTML file
      xhttp.open("GET", "Practical6.xml", true);
      xhttp.send();
    }

    function cdDetails(xml) {
      const xmlDoc = xml.responseXML;
      const cds = xmlDoc.getElementsByTagName("CD");

      let table = "<table border='1' cellpadding='8' style='border-collapse: collapse; margin:auto;'>";
      table += "<tr><th>Title</th><th>Artist</th><th>Country</th><th>Company</th><th>Price</th><th>Year</th></tr>";

      for (let i = 0; i < cds.length; i++) {
        table += "<tr><td>" +
          cds[i].getElementsByTagName("TITLE")[0].textContent + "</td><td>" +
          cds[i].getElementsByTagName("ARTIST")[0].textContent + "</td><td>" +
          cds[i].getElementsByTagName("COUNTRY")[0].textContent + "</td><td>" +
          cds[i].getElementsByTagName("COMPANY")[0].textContent + "</td><td>" +
          cds[i].getElementsByTagName("PRICE")[0].textContent + "</td><td>" +
          cds[i].getElementsByTagName("YEAR")[0].textContent + "</td></tr>";
      }

      table += "</table>";
      document.getElementById("cdTable").innerHTML = table;
    }
  </script>
</body>
</html>
